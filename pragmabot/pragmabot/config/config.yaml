rosbag_replay: true
gradio_share: false

# --- Memory Settings ---
activate_stm: true
activate_ltm: true
save_to_ltm: true
use_random_retrieval: false
retrieval_top_k: 5  # -1 for everything (unsorted)

# --- VLM API ---
# OpenAI:   vlm_model: gpt-4o-2024-08-06   (needs OPENAI_API_KEY)
# Anthropic: vlm_model: claude-opus-4-8     (needs ANTHROPIC_API_KEY)
# Gemini:   vlm_model: gemini-2.5-pro       (needs GOOGLE_API_KEY)
vlm:
  vlm_model: claude-opus-4-8
  # text_embedding_model is only used with OpenAI. Claude uses sentence-transformers
  # (all-MiniLM-L6-v2 locally). Gemini uses models/text-embedding-004 natively.
  text_embedding_model: text-embedding-3-large

# --- ROS Topics ---
# Verified against bags/red_cup/metadata.yaml (the only recording we have).
# Upstream's defaults were /zedxm/... - the ANYmal robot's camera, not ours.
# Three differences from upstream, all confirmed from the bag:
#   1. /zedxm/ -> /zed/          (different camera on this robot)
#   2. color is raw sensor_msgs/Image, NOT CompressedImage - there is no
#      /compressed topic in the bag at all. scene_observer subscribes with
#      the type named by color_image_compressed below.
#   3. camera_info is nested under the image topic
#      (/rgb/color/rect/image/camera_info), not a sibling /rgb/camera_info.
topics:
  color_image: /zed/zed_node/rgb/color/rect/image
  depth_image: /zed/zed_node/depth/depth_registered
  camera_info: /zed/zed_node/rgb/color/rect/image/camera_info
  # true  -> subscribe to color_image as sensor_msgs/CompressedImage
  # false -> subscribe as sensor_msgs/Image (what our bag actually contains)
  color_image_compressed: false