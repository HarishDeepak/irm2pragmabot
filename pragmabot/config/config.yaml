rosbag_replay: true
gradio_share: false

# --- Memory Settings ---
activate_stm: true
activate_ltm: true
save_to_ltm: true
use_random_retrieval: false
retrieval_top_k: 5  # -1 for everything (unsorted)

# --- VLM API ---
vlm:
  vlm_model: gpt-4o-2024-08-06
  text_embedding_model: text-embedding-3-large

# --- ROS Topics ---
topics:
  color_image: /zedxm/zed_node/rgb/image_rect_color/compressed
  depth_image: /zedxm/zed_node/depth/depth_registered
  camera_info: /zedxm/zed_node/rgb/camera_info